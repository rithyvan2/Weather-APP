<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=location_on" />
</head>
<body>
<main class="main-container">
    <header class="input-container">
        <input type="text" placeholder="Enter the City Name" class="city-input">
        <button class="search-btn">
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>
    </header>
    <section class="weather-info" style="display:none;">
        <div class="location-date-container">
            <div class="location">
                <span class="material-symbols-outlined">
                    location_on
                    </span>
                    <h4 class="country-txt">India</h4>
            </div>
            <h5 class="current-date-txt regular-txt">Wed, 07 Jan</h5>
        </div>
        <div class="weather-summary-container">
            <img src="assets/weather/clouds.svg" alt="" class="weather-summary-img">
            <div class="weather-summary-info">
                <h1 class="temp-txt">29 °C</h1>
                <h3 class="condition-txt regular-txt">Clouds</h3>
            </div>
        </div>
        <div class="weather-condition-container">
            <div class="condition-item">
                <i class="fa-solid fa-droplet"></i>
                    <div class="condition-info">
                        <h5 class="regular-txt">Humidity</h5>
                        <h5 class="humidity-value-txt">55%</h5>
                    </div>
            </div>
            <div class="condition-item">
                <i class="fa-solid fa-wind"></i>
                    <div class="condition-info">
                        <h5 class="regular-txt">Wind Speed</h5>
                        <h5 class="wind-value-txt">2 M/s</h5>
                    </div>
            </div>
        </div>
        <div class="forecast-items-container">
            <div class="forecast-item">
                <h5 class="forcast-item-date regular-txt">05 Jan</h5>
                <img src="assets/weather/rain.svg" alt="" class="forcast-item-img" id="image-1">
                <h5 class="forecast-item-temp">29 °C</h5>
            </div>
            <div class="forecast-item">
                <h5 class="forecast-item-date regular-txt">05 Jan</h5>
                <img src="assets/weather/rain.svg" alt="" class="forcast-item-img" id="image-1">
                <h5 class="forecast-item-temp">29 °C</h5>
            </div>
            <div class="forecast-item">
                <h5 class="forecast-item-date regular-txt">05 Jan</h5>
                <img src="assets/weather/rain.svg" alt="" class="forcast-item-img" id="image-1">
                <h5 class="forecast-item-temp">29 °C</h5>
            </div>
            <div class="forecast-item">
                <h5 class="forecast-item-date regular-txt">05 Jan</h5>
                <img src="assets/weather/rain.svg" alt="" class="forcast-item-img" id="image-1">
                <h5 class="forecast-item-temp">29 °C</h5>
            </div>
            <div class="forecast-item">
                <h5 class="forecast-item-date regular-txt">05 Jan</h5>
                <img src="assets/weather/rain.svg" alt="" class="forcast-item-img" id="image-1">
                <h5 class="forecast-item-temp">29 °C</h5>
            </div>
        </div>
    </section>

    <section class="search-city section-message">
        <img  src="assets/message/search-city.png" alt="">
         <div>
            <h1>Search City</h1>
            <h4 class="regular-txt">
                Find out the weather conditions of the city.
            </h4>
         </div>
    </section>

    <section class="not-found section-message" style="display: none;">
        <img src="assets/message/not-found.png" alt="">
         <div>
            <h1>Search City</h1>
            <h4 class="regular-txt">
                Find out the weather conditions of the city.
            </h4>
         </div>
    </section>
</main>
    <script src="script.js"></script>
</body>
</html>
